# Spec 003 (slice 003-01). Checks that every PR title is a conventional commit.
# PRs are squash-merged with the PR title as the subject, so the title is the
# commit release-please reads on main. The ruleset is jig's pr-title.yml, line
# for line; servo's matches it. ci.yml checks subjects pushed to main directly.
name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            chore
            refactor
            test
            build
            ci
          requireScope: true
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: |
            The subject "{subject}" must start lowercase and not end with a period.
